<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Cadastro de Alunos</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>    
<body>

    <h1>Cadastro de Alunos</h1>

    <section id="formulario-cadastro">
        <h2>Novo Aluno</h2>

        <label for="nome">Nome:</label>
        <input type="text" id="nome" placeholder="Nome completo">

        <label for="cpf">CPF:</label>
        <input type="text" id="cpf" placeholder="Somente números">

        <label for="data_nascimento">Data de nascimento:</label>
        <input type="date" id="data_nascimento">

        <label for="telefone">Telefone:</label>
        <input type="text" id="telefone" placeholder="(00) 00000-0000">

        <label for="email">E-mail:</label>
        <input type="email" id="email" placeholder="exemplo@email.com">
        
        <label for="data_matricula">Data da matrícula:</label>
        <input type="date" id="data_matricula">

        <button type="button" id="btn-cadastrar">Cadastrar</button>
        
        <p id="mensagem-status"></p>
    </section>

    <section id="listagem-alunos">
        <h2>Alunos Cadastrados</h2>

        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Nome</th>
                    <th>CPF</th>
                    <th>Nascimento</th>
                    <th>Telefone</th>
                    <th>E-mail</th>
                    <th>Matrícula</th>
                </tr>
            </thead>
            <tbody id="corpo-tabela-alunos">

            </tbody>
        </table>
    </section>

    <script src="{{ url_for('static', filename='js/aluno.js') }}"></script>
</body>
</html>
